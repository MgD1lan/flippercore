name: Build & Publish OTA (Fatalcore)

on:
  workflow_dispatch:
  push:
    tags:
      - 'fatalcore-v*'

permissions:
  contents: write

concurrency:
  group: ota-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_fatalcore/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Read firmware version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep -oP '#define\s+FURI_ESP32_VERSION\s+"\K[^"]+' components/toolbox/fw_version.h)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $V"

      - name: Build Fatalcore
        shell: bash
        run: |
          set -euo pipefail
          source ~/esp/esp-idf/export.sh
          # Board defaults are mandatory: without them the image uses the
          # generic config (no board pins, bigger binary) and would not match
          # the image that is validated on hardware.
          #
          # set-target is mandatory too: sdkconfig.defaults still pins
          # CONFIG_IDF_TARGET="esp32c6" for the upstream default board, and a
          # fresh checkout has no sdkconfig to inherit the S3 target from.
          # Without this step the release workflow builds an ESP32-C6 image.
          idf.py -B build_fatalcore -DFLIPPER_BOARD=fatalcore \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.fatalcore" \
            set-target esp32s3
          idf.py -B build_fatalcore -DFLIPPER_BOARD=fatalcore \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.fatalcore" \
            build partition-table
          # Refuse to publish a build for the wrong silicon.
          grep -q '^CONFIG_IDF_TARGET="esp32s3"$' sdkconfig
          esptool.py image_info --version 2 build_fatalcore/furi_esp32.bin \
            | grep -q 'Detected image type: ESP32-S3'

      - name: Prepare OTA payload
        shell: bash
        run: |
          set -euo pipefail
          source ~/esp/esp-idf/export.sh
          # ota_data_initial.bin is only generated by the partition-table target,
          # not by `idf.py build` (already built together above).
          mkdir -p ota/latest
          cp build_fatalcore/furi_esp32.bin ota/latest/furi_esp32.bin
          printf '%s\n' '${{ steps.ver.outputs.version }}' > ota/latest/version.txt
          for f in bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin; do
            if [ -f "build_fatalcore/$f" ]; then
              cp "build_fatalcore/$f" ota/latest/
            else
              echo "WARN: build_fatalcore/$f missing, skipping"
            fi
          done
          ls -la ota/latest

      - name: Publish to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Publish from a separate clone: the build workspace has modified
          # tracked files (sdkconfig, dependencies.lock) and cannot be switched.
          PUB="${RUNNER_TEMP}/ota-pages-pub"
          rm -rf "$PUB"
          if git clone --depth 1 --branch gh-pages "$REMOTE" "$PUB" 2>/dev/null; then
            echo "publishing on top of existing gh-pages"
          else
            git clone --depth 1 "$REMOTE" "$PUB"
            git -C "$PUB" checkout --orphan gh-pages
            git -C "$PUB" rm -rf . >/dev/null 2>&1 || true
          fi
          # Only the payload is regenerated here. The browser flasher
          # (index.html, manifest.json) and the diagnostic page live on the
          # same branch by hand and must survive a publish.
          rm -rf "$PUB/latest" "$PUB/firmware"
          cp -r "${GITHUB_WORKSPACE}/ota/latest" "$PUB/latest"
          mkdir -p "$PUB/firmware"
          cp "${GITHUB_WORKSPACE}"/ota/latest/*.bin "$PUB/firmware/"

          VERSION='${{ steps.ver.outputs.version }}'
          RAW_SIZE=$(stat -c%s "${GITHUB_WORKSPACE}/ota/latest/furi_esp32.bin")
          SIZE="$RAW_SIZE"

          if [ -f "$PUB/manifest.json" ]; then
            sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*/\1${VERSION}/" "$PUB/manifest.json"
          fi
          if [ -f "$PUB/index.html" ]; then
            sed -i -E "s/версия [0-9]+\.[0-9]+\.[0-9]+/версия ${VERSION}/" "$PUB/index.html"
            sed -i -E "s/<b>[0-9 ]+<\/b> байт/<b>${SIZE}<\/b> байт/" "$PUB/index.html"
          fi

          git -C "$PUB" add -A
          git -C "$PUB" commit -m "OTA ${GITHUB_REF_NAME:-manual} (${GITHUB_SHA::7})" || echo "no changes"
          git -C "$PUB" push origin gh-pages