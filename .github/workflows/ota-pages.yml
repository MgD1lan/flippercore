name: Build & Publish OTA (Fatal Core)

on:
  workflow_dispatch:
  push:
    tags:
      - 'fatalcore-v*'

permissions:
  contents: write

concurrency:
  group: ota-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_fatalcore/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Read firmware version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep -oP '#define\s+FURI_ESP32_VERSION\s+"\K[^"]+' components/toolbox/fw_version.h)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $V"

      - name: Build Fatal Core
        shell: bash
        run: |
          set -euo pipefail
          source ~/esp/esp-idf/export.sh
          idf.py -B build_fatalcore -DFLIPPER_BOARD=fatalcore build

      - name: Prepare OTA payload
        shell: bash
        run: |
          set -euo pipefail
          source ~/esp/esp-idf/export.sh
          # ota_data_initial.bin is only generated by the partition-table target,
          # not by `idf.py build`.
          idf.py -B build_fatalcore -DFLIPPER_BOARD=fatalcore partition-table
          mkdir -p ota/latest
          cp build_fatalcore/furi_esp32.bin ota/latest/furi_esp32.bin
          printf '%s\n' '${{ steps.ver.outputs.version }}' > ota/latest/version.txt
          for f in bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin; do
            if [ -f "build_fatalcore/$f" ]; then
              cp "build_fatalcore/$f" ota/latest/
            else
              echo "WARN: build_fatalcore/$f missing, skipping"
            fi
          done
          ls -la ota/latest

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name ota -exec rm -rf {} +
          mv ota/latest ./latest
          rmdir ota
          git add -A
          git commit -m "OTA ${GITHUB_REF_NAME:-manual} (${GITHUB_SHA::7})" || echo "no changes"
          git push origin gh-pages